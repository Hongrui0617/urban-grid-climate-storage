project:
  name: urban-grid-climate-storage
  city: tokyo
  timezone: Asia/Tokyo

paths:
  load_data: data_raw/TEPCO_Load_2016_2022_hourly_with_units.csv
  weather_data: data_raw/Tokyo_TempRH_2016_2022_hourly_wide_clean.csv
  model_dataset: data_processed/tokyo_model_dataset.csv
  data_quality_report: outputs/reports/data_quality_report.md
  eda_figures_dir: outputs/figures/eda
  eda_tables_dir: outputs/tables/eda
  baseline_metrics: outputs/model_results/baseline_metrics.csv
  baseline_predictions_test: outputs/predictions/baseline_predictions_test.csv
  modeling_figures_dir: outputs/figures/modeling
  model_evaluation_report: outputs/reports/load_forecasting_model_evaluation.md
  output_dir: outputs

raw_columns:
  load:
    datetime: datetime_jst
    load: load_MW
  weather:
    datetime: datetime
    temperature: temp_c
    relative_humidity: rh_percent

columns:
  datetime: timestamp
  load: load_mw
  temperature: temperature_c
  relative_humidity: rh_percent

data:
  start_date: "2016-01-01"
  end_date: "2022-12-31"
  frequency: "h"
  weather_interpolate_limit_hours: 6

quality:
  relative_humidity_min: 0
  relative_humidity_max: 100

features:
  use_temperature: true
  use_relative_humidity: true
  use_calendar_features: true
  use_lag_features: true
  lag_hours:
    - 1
    - 24
    - 168

split:
  train_start: "2016-04-01 00:00:00"
  train_end: "2020-12-31 23:00:00"
  validation_start: "2021-01-01 00:00:00"
  validation_end: "2021-12-31 23:00:00"
  test_start: "2022-01-01 00:00:00"
  test_end: "2022-12-31 23:00:00"
  train_years:
    - 2016
    - 2017
    - 2018
    - 2019
    - 2020
  validation_years:
    - 2021
  test_years:
    - 2022

models:
  baseline:
    enabled: true
    methods:
      - previous_day_same_hour
      - previous_week_same_hour
      - ridge_climate
      - hist_gradient_boosting_climate
      - ridge_forecast
      - hist_gradient_boosting_forecast
    feature_sets:
      climate:
        - temperature_c
        - rh_percent
        - hour
        - dayofweek
        - month
        - is_weekend
      forecast:
        - temperature_c
        - rh_percent
        - hour
        - dayofweek
        - month
        - is_weekend
        - lag_1
        - lag_24
        - lag_168
    ridge:
      alpha: 1.0
    hist_gradient_boosting:
      max_iter: 300
      learning_rate: 0.05
      max_leaf_nodes: 31
      l2_regularization: 0.0
      random_state: 42

  lstm:
    enabled: true
    sequence_length: 168
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    batch_size: 64
    epochs: 20
    learning_rate: 0.001
    patience: 5

evaluation:
  metrics:
    - MAE
    - RMSE
    - MAPE
    - R2
  segments:
    - overall
    - summer_JJA
    - winter_DJF
    - hot_hours_temp_ge_30
    - hot_hours_temp_ge_33
    - peak_top_5_percent_load
    - weekday
    - weekend

eda:
  figure_dpi: 150
  temperature_bin_width_c: 2
  top_load_percentile: 0.95
  top_peak_events: 50
