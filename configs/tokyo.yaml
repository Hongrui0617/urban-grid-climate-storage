project:
  name: urban-grid-climate-storage
  city: tokyo
  timezone: Asia/Tokyo

paths:
  load_data: data_raw/TEPCO_Load_2016_2022_hourly_with_units.csv
  weather_data: data_raw/Tokyo_TempRH_2016_2022_hourly_wide_clean.csv
  model_dataset: data_processed/tokyo_model_dataset.csv
  data_quality_report: outputs/reports/data_quality_report.md
  eda_figures_dir: outputs/figures/eda
  eda_tables_dir: outputs/tables/eda
  output_dir: outputs

raw_columns:
  load:
    datetime: datetime_jst
    load: load_MW
  weather:
    datetime: datetime
    temperature: temp_c
    relative_humidity: rh_percent

columns:
  datetime: timestamp
  load: load_mw
  temperature: temperature_c
  relative_humidity: rh_percent

data:
  start_date: "2016-01-01"
  end_date: "2022-12-31"
  frequency: "h"
  weather_interpolate_limit_hours: 6

quality:
  relative_humidity_min: 0
  relative_humidity_max: 100

features:
  use_temperature: true
  use_relative_humidity: true
  use_calendar_features: true
  use_lag_features: true
  lag_hours:
    - 1
    - 24
    - 168

split:
  train_years:
    - 2016
    - 2017
    - 2018
    - 2019
    - 2020
  validation_years:
    - 2021
  test_years:
    - 2022

models:
  baseline:
    enabled: true
    methods:
      - seasonal_naive_24
      - seasonal_naive_168
      - random_forest

  lstm:
    enabled: true
    sequence_length: 168
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    batch_size: 64
    epochs: 20
    learning_rate: 0.001
    patience: 5

evaluation:
  metrics:
    - MAE
    - RMSE
    - sMAPE
    - Top1pct_MAE

eda:
  figure_dpi: 150
  temperature_bin_width_c: 2
  top_load_percentile: 0.95
  top_peak_events: 50
